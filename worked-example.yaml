statement: |
  This worked example demonstrates how `BankAccount` state and operations are modeled in C++ using object-oriented classes and member methods. We'll examine:
  1. The `BankAccount` class declaration and `public:` member fields (`owner` and `balance`).
  2. The constructor using modern C++ member initializer list syntax.
  3. The `deposit` method with positive input validation and state mutation.
  4. The `withdraw` method with compound guard logic protecting against overdrafts.
  5. The `main` driver function demonstrating direct object instantiation, method calls, and `std::cout` stream output.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Demonstrates the step-by-step execution and final state of the bank account transactions."
elements:
  - type: explanation
    location:
      snippet: |-
        class BankAccount {
        public:
            std::string owner;
            int balance;
    explanations:
      - body: |
          ### 1. Class Declaration and Member Fields
          * `class BankAccount`: In C++, a `class` encapsulates data members and member functions. Unlike structs where members default to `public`, class members default to `private`.
          * `public:`: Access specifier making subsequent members accessible from outside the class.
          * `std::string owner;`: High-level dynamic string type from the C++ standard library.
          * `int balance;`: Standard primitive integer field holding the balance.
  - type: explanation
    location:
      snippet: 'BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}'
    explanations:
      - body: |
          ### 2. Constructor and Member Initializer List
          * `BankAccount(std::string owner, int balance)`: The constructor takes initial values for `owner` and `balance`.
          * `: owner(owner), balance(balance)`: The **member initializer list** initializes the class fields directly before the constructor body executes. In C++, this is more efficient and idiomatic than default-constructing and subsequently assigning inside the body `{}`.
  - type: explanation
    location:
      snippet: |2-

            int deposit(int amount) {
                if (amount > 0) {
                    this->balance = this->balance + amount;
                    std::cout << "Deposited " << amount << std::endl;
                }
                return this->balance;
            }
    explanations:
      - body: |
          ### 3. The `deposit` Method
          * **Input Validation**: `if (amount > 0)` guards against zero or negative deposit amounts.
          * **State Mutation**: `this->balance = this->balance + amount;` credits the balance. In C++, `this` is a pointer to the current instance, so member access uses `->`.
          * **Stream Output**: `std::cout << "Deposited " << amount << std::endl;` writes output to standard output using the insertion operator (`<<`).
          * **Return Value**: `return this->balance;` returns the updated balance.
  - type: explanation
    location:
      snippet: |2-

            int withdraw(int amount) {
                if (0 < amount && amount <= this->balance) {
                    this->balance = this->balance - amount;
                    std::cout << "Withdrew " << amount << std::endl;
                } else {
                    std::cout << "Insufficient funds" << std::endl;
                }
                return this->balance;
            }
    explanations:
      - body: |
          ### 4. The `withdraw` Method and Overdraft Protection
          * **Compound Guard Condition**: `if (0 < amount && amount <= this->balance)` checks two conditions with `&&`:
            1. `0 < amount`: The withdrawal amount must be strictly positive.
            2. `amount <= this->balance`: The withdrawal must not exceed current funds (allowing full withdrawals down to 0).
          * **Successful Debit**: When valid, `this->balance = this->balance - amount;` debits the balance and prints confirmation.
          * **Fallback Branch**: The `else` block catches overdraft attempts or invalid amounts by printing `"Insufficient funds"` without modifying `this->balance`.
          * **Return Value**: Returns the current balance in all cases.
  - type: explanation
    location:
      snippet: |-
        int main() {
            BankAccount account("Bob", 200);
            account.deposit(100);
            account.withdraw(50);
            std::cout << "Balance: " << account.balance << std::endl;
            return 0;
        }
    explanations:
      - body: |
          ### 5. Execution Flow in `main`
          * `BankAccount account("Bob", 200);`: Direct stack-based initialization of a `BankAccount` object for `"Bob"` with an initial balance of `200`.
          * `account.deposit(100);`: Invokes `deposit`, increasing balance to 300 and printing `"Deposited 100"`.
          * `account.withdraw(50);`: Invokes `withdraw`, decreasing balance to 250 and printing `"Withdrew 50"`.
          * `std::cout << "Balance: " << account.balance << std::endl;`: Streams `"Balance: 250"` to console output.
          * `return 0;`: Returns success status to the operating system.

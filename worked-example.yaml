elements:
  - type: explanation
    location:
      snippet: "BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}"
    explanations:
      - body: |
          The constructor initializes member fields in C++ using member initialization list syntax:
          ```cpp
          BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}
          ```
          This directly initializes `owner` and `balance` when the object is instantiated.
      - body: |
          ...
  - type: explanation
    location:
      snippet: "if (0 < amount && amount <= this->balance) {"
    explanations:
      - body: |
          This condition validates that the withdrawal transaction is correct: it checks if the `amount` is greater than `0` and is less than or equal to the current `this->balance`.

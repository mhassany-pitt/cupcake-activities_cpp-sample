question: |
  Given the following C++ class definition for `BankAccount`:
  
  ```cpp
  class BankAccount {
  public:
      std::string owner;
      int balance;

      BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}
  };
  ```
  
  Which of the following represents the correct implementation for a `deposit` member method in C++ that adds a positive `amount` to the account balance and returns the new balance?
choices:
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              this->balance += amount;
              return this->balance;
          }
          throw std::invalid_argument("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          This is the correct implementation. It verifies that the deposit `amount` is positive (`amount > 0`), updates the member variable `this->balance` using the `+=` operator, and returns the updated balance. It also correctly throws a `std::invalid_argument` for invalid amounts.
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              int balance = balance + amount;
              return balance;
          }
          return balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Declaring `int balance = ...` inside the method creates a shadowed local variable instead of updating the instance variable `this->balance`.
  - body: |
      ```cpp
      int deposit(int amount) {
          this->balance =+ amount;
          return this->balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` assigns positive `amount` (`this->balance = +amount`), which overwrites the balance rather than adding to it. The correct operator is `+=`.
  - body: None
    role: distractor
    include: always
    order: 2

include_choices: 4
question: |
  Given the following C++ class definition:
  
  ```cpp
  class BankAccount {
  public:
      std::string owner;
      int balance;

      BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}
  };
  ```
  
  Which of the following represents the correct implementation for a `deposit` member function in C++ that validates positive deposit amounts, modifies the instance balance, and returns the new balance?
choices:
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              this->balance += amount;
              return this->balance;
          }
          throw std::invalid_argument("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Validates that `amount > 0`.
          2. Updates member state using `this->balance += amount`.
          3. Returns the updated `int` balance.
          4. Correctly throws a `std::invalid_argument` exception for non-positive inputs.
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              int balance = this->balance + amount;
              return balance;
          }
          return this->balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Declaring `int balance = ...` creates a shadowed local variable inside the method scope, leaving the instance member `this->balance` unmodified.
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              this->balance =+ amount;
              return this->balance;
          }
          return this->balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`this->balance = +amount`), which overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```cpp
      int deposit(int amount) {
          if (amount > 0) {
              this.balance += amount;
              return this.balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In C++, `this` is a pointer to the current instance object (`BankAccount*`), not a direct reference. Accessing members via `this.balance` causes a C++ compilation error: `member reference type 'BankAccount *' is a pointer; did you mean to use '->'?`.

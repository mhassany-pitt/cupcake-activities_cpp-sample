$schema: https://learning-contents.org/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: main.cpp
title: Bank Account Methods and Constructor in C++
description: Rearrange the C++ member functions and constructor to properly manage BankAccount instance state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - conditional-logic
runtime:
  language: cpp
statement: |
  Rearrange the blocks to correctly implement the constructor and member methods for the `BankAccount` class in C++.
  Make sure to:
  1. Initialize the member variables (`owner` and `balance`) using a member initializer list.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
executions:
  - title: Standard Transaction
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: block
    group: bank-members
    location:
      snippet: 'BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}'
    choices:
      - snippet: 'BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}'
        role: solution
        explanations:
          - body: |
              Correct! Uses C++ member initializer list syntax `: owner(owner), balance(balance)` to directly initialize the member variables with the constructor parameters.
      - snippet: |-
          BankAccount(std::string owner, int balance) {
              owner = owner;
              balance = balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Without `this->`, `owner = owner` assigns parameters back to themselves (parameter shadowing), leaving the class members default-initialized or uninitialized.
  - type: block
    group: bank-members
    location:
      snippet: |2-

            int deposit(int amount) {
                if (amount > 0) {
                    this->balance = this->balance + amount;
                    std::cout << "Deposited " << amount << std::endl;
                }
                return this->balance;
            }
    choices:
      - snippet: |2-

              int deposit(int amount) {
                  if (amount > 0) {
                      this->balance = this->balance + amount;
                      std::cout << "Deposited " << amount << std::endl;
                  }
                  return this->balance;
              }
        role: solution
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `this->balance`, streams confirmation to standard output, and returns the updated balance.
      - snippet: |-
          int deposit(int amount) {
              this->balance = this->balance + amount;
              std::cout << "Deposited " << amount << std::endl;
              return this->balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Omits the `if (amount > 0)` input validation guard, allowing negative or zero deposit amounts to erroneously alter the account balance.
      - snippet: |-
          int deposit(int amount) {
              if (amount > 0) {
                  this->balance = this->balance - amount;
                  std::cout << "Deposited " << amount << std::endl;
              }
              return this->balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Uses subtraction (`-`) instead of addition (`+`), deducting money from the account balance during a deposit transaction.
  - type: block
    group: bank-members
    location:
      snippet: |2-

            int withdraw(int amount) {
                if (0 < amount && amount <= this->balance) {
                    this->balance = this->balance - amount;
                    std::cout << "Withdrew " << amount << std::endl;
                } else {
                    std::cout << "Insufficient funds" << std::endl;
                }
                return this->balance;
            }
    choices:
      - snippet: |2-

              int withdraw(int amount) {
                  if (0 < amount && amount <= this->balance) {
                      this->balance = this->balance - amount;
                      std::cout << "Withdrew " << amount << std::endl;
                  } else {
                      std::cout << "Insufficient funds" << std::endl;
                  }
                  return this->balance;
              }
        role: solution
        explanations:
          - body: |
              Correct! Verifies that `0 < amount && amount <= this->balance`, debits the account when funds are sufficient, prints an error message when funds are insufficient, and returns `this->balance`.
      - snippet: |-
          int withdraw(int amount) {
              this->balance = this->balance - amount;
              std::cout << "Withdrew " << amount << std::endl;
              return this->balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= this->balance`, allowing the account balance to plunge into negative numbers.
      - snippet: |-
          int withdraw(int amount) {
              if (0 < amount && amount > this->balance) {
                  this->balance = this->balance - amount;
                  std::cout << "Withdrew " << amount << std::endl;
              } else {
                  std::cout << "Insufficient funds" << std::endl;
              }
              return this->balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. The comparison `amount > this->balance` inverts the logic: it only allows withdrawals when the amount exceeds the balance, guaranteeing an overdraft on every successful withdrawal!

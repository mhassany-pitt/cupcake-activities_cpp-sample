statement: |
  In the `main` function, write the C++ code to interact with the `BankAccount` class:
  1. Instantiate a `BankAccount` object named `account` for owner `"Bob"` with an initial balance of `200`.
  2. Call `deposit` with an amount of `100`.
  3. Call `withdraw` with an amount of `50`.
  4. Stream the final balance to `std::cout` in the format: `Balance: <balance>\n`.
executions:
  - title: Standard Transaction Sequence
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        #include <iostream>
        #include <string>

        class BankAccount {
        public:
            std::string owner;
            int balance;

            BankAccount(std::string owner, int balance) : owner(owner), balance(balance) {}

            int deposit(int amount) {
                if (amount > 0) {
                    this->balance = this->balance + amount;
                    std::cout << "Deposited " << amount << std::endl;
                }
                return this->balance;
            }

            int withdraw(int amount) {
                if (0 < amount && amount <= this->balance) {
                    this->balance = this->balance - amount;
                    std::cout << "Withdrew " << amount << std::endl;
                } else {
                    std::cout << "Insufficient funds" << std::endl;
                }
                return this->balance;
            }
        };
  - type: editable
    location:
      snippet: |-
            BankAccount account("Bob", 200);
            account.deposit(100);
            account.withdraw(50);
            std::cout << "Balance: " << account.balance << std::endl;
